[project]
name = "meshqu-runner"
version = "0.1.0"
description = "Procurement-decisions experiment harness — automated execution capture"
requires-python = ">=3.11"
dependencies = [
  "requests==2.32.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
