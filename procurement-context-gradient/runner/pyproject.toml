[project]
name = "meshqu-runner-e2"
version = "0.2.0"
description = "Procurement-context-gradient (E2) experiment harness — multi-pass orchestration over 5 context levels"
requires-python = ">=3.11"
dependencies = [
  "requests==2.32.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default invocation runs hermetic tests only. The `live` marker
# gates tests that hit the real OpenAI API (E2-005 cache preservation
# smoke). Run them explicitly with `pytest -m live`.
addopts = "-q -m 'not live'"
markers = [
  "live: hits external services (OpenAI). Skipped by default; run with `pytest -m live`.",
]
